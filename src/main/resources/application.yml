spring:
  application:
    name: store-master
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/store_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  paging:
    default-size: 20
    max-size: 100
  search:
    province-match: EXACT
    include-whitelist: true
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    expiration: 2h
  bootstrap:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
  seed:
    branches: 120
    stores: 20000
